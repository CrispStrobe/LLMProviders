name: Update benchmark data

on:
  schedule:
    - cron: '0 5 * * *'   # daily at 05:00 UTC (LMArena publishes daily)
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # HF Space push requires full history

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch all benchmark data
        env:
          # Optional. Without it the Artificial Analysis source is skipped.
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: node scripts/fetch-benchmarks.js

      - name: Check coverage
        run: |
          node -e "
          const d = require('./data/benchmarks.json');
          const n = (k) => d.filter((x) => x[k] !== undefined && x[k] !== null).length;
          const c = {
            total: d.length,
            hf: n('hf_id'),
            arena: n('arena_elo'),
            livebench: n('lb_global'),
            aider: n('aider_pass_rate'),
            skillsbench: n('sb_score'),
            omnidoc: n('ocr_omnidoc'),
          };
          console.log(c);
          const bad = [];
          if (c.hf < 1000) bad.push('hf');
          if (c.arena < 100) bad.push('arena');
          if (c.livebench < 50) bad.push('livebench');
          if (c.omnidoc < 10) bad.push('omnidoc');
          if (bad.length) {
            console.error('benchmark coverage regressed: ' + bad.join(', '));
            process.exit(1);
          }
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks.json
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "chore: update benchmark data [skip ci]" &&
            git push origin main
          )

      - name: Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is not set, skipping sync."
            exit 0
          fi
          git remote add hf https://cstr:$HF_TOKEN@huggingface.co/spaces/cstr/LLMProviders || true
          cat .huggingface/space.yml README.md > HF_README.md
          mv HF_README.md README.md
          git commit -am "chore: sync to Hugging Face with metadata" || true
          git push hf main --force
